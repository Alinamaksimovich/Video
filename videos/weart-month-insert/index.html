<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1072, height=816" />
    <title>WeArt month insert</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Roboto Flex";
        src: url("assets/fonts/rf-lat.woff2") format("woff2");
        font-weight: 100 1000;
        font-stretch: 25% 151%;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1072px; height: 816px; overflow: hidden; background: #f9f7f5; }
      #root { position: relative; width: 1072px; height: 816px; overflow: hidden; background: #f9f7f5; font-family: "Roboto Flex", system-ui, sans-serif; color: #f5f7fa; }
      .scene { position: absolute; inset: 0; opacity: 0; }
      .card { position: absolute; left: 56px; width: 960px; border-radius: 48px; background: #11151f; border: 3px solid #272f45; box-shadow: 0 24px 60px rgba(14, 22, 40, 0.22); overflow: hidden; }
      .ic { fill: none; stroke: #f5f7fa; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .lime { stroke: #d8f27f; }

      /* step chip */
      .chip { position: absolute; left: 56px; top: 34px; height: 72px; padding: 0 34px 0 26px; border-radius: 36px; background: #11151f; display: flex; align-items: center; gap: 16px; font-size: 36px; font-weight: 700; white-space: nowrap; }
      .chip b { display: inline-block; padding: 6px 18px; border-radius: 24px; background: #d8f27f; color: #11151f; font-size: 30px; font-weight: 800; }
      .chip svg { width: 44px; height: 44px; }

      /* 0 · all in one place */
      #c0 { top: 40px; height: 300px; display: flex; align-items: center; justify-content: center; background: radial-gradient(90% 120% at 50% 30%, #0f3a52 0%, #0a1e36 55%, #060b16 100%); }
      #c0 img { width: 360px; }
      .tile { position: absolute; top: 380px; width: 222px; height: 380px; border-radius: 40px; background: #11151f; border: 3px solid #272f45; box-shadow: 0 20px 50px rgba(14, 22, 40, 0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; font-size: 38px; font-weight: 800; white-space: nowrap; }
      .tile svg { width: 96px; height: 96px; }

      /* 1 · chat */
      #c1 { top: 132px; height: 650px; padding: 34px 40px; }
      .msg { margin-left: auto; width: fit-content; max-width: 760px; padding: 20px 30px; border-radius: 30px 30px 8px 30px; background: #d8f27f; color: #11151f; font-size: 36px; font-weight: 600; white-space: nowrap; min-height: 84px; }
      .rows { margin-top: 26px; }
      .row { display: flex; align-items: center; gap: 22px; height: 82px; margin-bottom: 14px; padding: 0 26px; border-radius: 24px; background: #1a2030; border: 2px solid #2c3550; font-size: 32px; font-weight: 500; white-space: nowrap; opacity: 0; }
      .row span { color: #d8f27f; font-weight: 800; width: 104px; }
      .count { position: absolute; right: 40px; bottom: 30px; font-size: 34px; font-weight: 700; color: #9aa6c2; }
      .count em { font-style: normal; color: #d8f27f; font-size: 52px; font-weight: 900; }

      /* 2+3 · images -> videos */
      #c2 { top: 132px; height: 650px; padding: 30px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 24px; }
      .ph { position: relative; border-radius: 30px; overflow: hidden; background: #1a2030; }
      .ph svg.p { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
      .ph .sh { position: absolute; inset: 0; background: linear-gradient(110deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0.14) 50%, rgba(255, 255, 255, 0) 70%); background-size: 300% 100%; }
      .ph .d { position: absolute; left: 18px; top: 16px; padding: 4px 14px; border-radius: 16px; background: rgba(10, 14, 24, 0.6); font-size: 24px; font-weight: 700; }
      .ph .play { position: absolute; left: 50%; top: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; background: rgba(10, 14, 24, 0.55); border: 3px solid #f5f7fa; opacity: 0; }
      .ph .play::after { content: ""; position: absolute; left: 32px; top: 24px; border-left: 28px solid #f5f7fa; border-top: 17px solid transparent; border-bottom: 17px solid transparent; }
      .ph .pr { position: absolute; left: 18px; right: 18px; bottom: 18px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.3); opacity: 0; }
      .ph .pr i { display: block; height: 100%; width: 100%; border-radius: 4px; background: #d8f27f; transform-origin: 0 50%; transform: scaleX(0); }

      /* 4 · audio */
      #c4 { top: 132px; height: 650px; padding: 36px 40px; }
      .track { height: 270px; border-radius: 34px; background: #1a2030; border: 2px solid #2c3550; padding: 26px 34px; margin-bottom: 30px; }
      .tl { display: flex; align-items: center; gap: 16px; font-size: 36px; font-weight: 700; margin-bottom: 12px; }
      .tl svg { width: 46px; height: 46px; }
      .bars { display: flex; align-items: center; justify-content: space-between; height: 160px; }
      .bars b { display: block; width: 10px; height: 150px; border-radius: 5px; transform: scaleY(0.08); }

      /* 5 · post */
      #c5 { top: 132px; height: 650px; display: flex; align-items: center; justify-content: center; }
      #post { position: relative; width: 520px; height: 150px; border-radius: 75px; background: #d8f27f; color: #11151f; font-size: 64px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 22px; }
      #post svg { width: 64px; height: 64px; }
      #post .ok { position: absolute; inset: 0; border-radius: 75px; background: #d8f27f; display: flex; align-items: center; justify-content: center; gap: 20px; opacity: 0; }
      #cursor { position: absolute; left: 640px; top: 520px; width: 70px; height: 70px; }

      /* 6 · month */
      #c6 { top: 132px; height: 650px; padding: 34px 44px; }
      .mh { display: flex; justify-content: space-between; align-items: baseline; font-size: 44px; font-weight: 800; margin-bottom: 22px; white-space: nowrap; }
      .mh em { font-style: normal; color: #d8f27f; }
      .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; }
      .cal i { display: flex; align-items: center; justify-content: center; height: 78px; border-radius: 18px; background: #1a2030; border: 2px solid #2c3550; font-style: normal; font-size: 28px; font-weight: 700; color: #8d97b0; }
      .cal i u { text-decoration: none; }
      .cal i.on { position: relative; }
      .cal i s { position: absolute; inset: -2px; border-radius: 18px; background: #d8f27f; opacity: 0; display: flex; align-items: center; justify-content: center; color: #11151f; text-decoration: none; }
      #eve { position: absolute; right: 44px; top: 30px; height: 64px; padding: 0 26px; border-radius: 32px; background: #d8f27f; color: #11151f; display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 800; opacity: 0; white-space: nowrap; }
      #eve svg { width: 36px; height: 36px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.75" data-width="1072" data-height="816">
      <!-- 0 · "It's all on WeArt Studio in one place" -->
      <div class="scene" id="s0">
        <div class="card" id="c0"><img src="assets/img/wa-logo.png" alt="WeArt Studio" /></div>
        <div class="tile" id="k1" style="left: 56px"><svg viewBox="0 0 24 24"><path class="ic" d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-5 4v-4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>AI Chat</div>
        <div class="tile" id="k2" style="left: 302px"><svg viewBox="0 0 24 24"><rect class="ic" x="3" y="4" width="18" height="16" rx="3"/><circle class="ic" cx="9" cy="9.500" r="1.800"/><path class="ic" d="M3.500 17l5-5 4 4 3-3 5 5"/></svg>AI Image</div>
        <div class="tile" id="k3" style="left: 548px"><svg viewBox="0 0 24 24"><rect class="ic" x="3" y="5" width="18" height="14" rx="3"/><path class="ic" d="M10 9l5 3-5 3z"/></svg>AI Video</div>
        <div class="tile" id="k4" style="left: 794px"><svg viewBox="0 0 24 24"><path class="ic" d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect class="ic" x="3" y="13" width="4" height="7" rx="1.500"/><rect class="ic" x="17" y="13" width="4" height="7" rx="1.500"/></svg>AI Audio</div>
      </div>

      <!-- 1 · "Step one, AI Chat writes 30 days of scripts" -->
      <div class="scene" id="s1">
        <div class="chip"><b>STEP 1</b><svg viewBox="0 0 24 24"><path class="ic" d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-5 4v-4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>AI Chat</div>
        <div class="card" id="c1">
          <div class="msg"><span id="typed"></span></div>
          <div class="rows">
            <div class="row"><span>Day 1</span>Morning routine hook</div>
            <div class="row"><span>Day 2</span>3 outfits, 1 jacket</div>
            <div class="row"><span>Day 3</span>Behind the scenes</div>
            <div class="row"><span>Day 4</span>Try-on reaction</div>
          </div>
          <div class="count"><em id="n1">0</em> / 30 scripts</div>
        </div>
      </div>

      <!-- 2+3 · "generate photos for each one" -> "turn them into videos" -->
      <div class="scene" id="s2">
        <div class="chip" id="ch2"><b><span class="a2">STEP 2</span><span class="a3" style="display:none">STEP 3</span></b><span class="a2">AI Image</span><span class="a3" style="display:none">AI Video</span></div>
        <div class="card" id="c2"></div>
      </div>

      <!-- 4 · "add voice and music" -->
      <div class="scene" id="s4">
        <div class="chip"><b>STEP 4</b><svg viewBox="0 0 24 24"><path class="ic" d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect class="ic" x="3" y="13" width="4" height="7" rx="1.500"/><rect class="ic" x="17" y="13" width="4" height="7" rx="1.500"/></svg>AI Audio</div>
        <div class="card" id="c4">
          <div class="track"><div class="tl"><svg viewBox="0 0 24 24"><rect class="ic lime" x="9" y="3" width="6" height="11" rx="3"/><path class="ic lime" d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Voice</div><div class="bars" id="wv1"></div></div>
          <div class="track"><div class="tl"><svg viewBox="0 0 24 24"><path class="ic" style="stroke: #b9a8f0" d="M9 18V5l11-2v13"/><circle class="ic" style="stroke: #b9a8f0" cx="6" cy="18" r="3"/><circle class="ic" style="stroke: #b9a8f0" cx="17" cy="16" r="3"/></svg>Music</div><div class="bars" id="wv2"></div></div>
        </div>
      </div>

      <!-- 5 · "then post" -->
      <div class="scene" id="s5">
        <div class="card" id="c5">
          <div id="post"><svg viewBox="0 0 24 24"><path class="ic" style="stroke: #11151f; stroke-width: 2.4" d="M4 12l16-8-6 16-3-7z"/></svg>Post<div class="ok"><svg viewBox="0 0 24 24"><path class="ic" style="stroke: #11151f; stroke-width: 2.6" d="M5 12.500l4.500 4.500L19 7.500"/></svg>Posted</div></div>
        </div>
        <svg id="cursor" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.500L10 19z" fill="#f5f7fa" stroke="#11151f" stroke-width="1.400" stroke-linejoin="round"/></svg>
      </div>

      <!-- 6 · "a month of content in one evening" -->
      <div class="scene" id="s6">
        <div class="card" id="c6">
          <div class="mh"><span>A month of content</span></div>
          <div class="cal" id="cal"></div>
          <div id="eve"><svg viewBox="0 0 24 24"><path d="M20 14.500A8 8 0 1 1 9.500 4a6.500 6.500 0 0 0 10.500 10.500z" fill="#11151f"/></svg>1 evening</div>
        </div>
      </div>
    </div>

    <script>
      // ---------- build repeated parts (deterministic) ----------
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

      // 6 "photos": soft studio portraits of a virtual model (drawn, no real images)
      const BG = [["#f3c6b8", "#e98f7b"], ["#c9d8f2", "#7d9de0"], ["#e6dcf7", "#a78ee6"], ["#d8f27f", "#9ec24a"], ["#f7e2c4", "#e0a868"], ["#bfe7e0", "#5fb8a8"]];
      const OUT = ["#11151f", "#f5f7fa", "#2a3350", "#11151f", "#6b3f2a", "#1d3b52"];
      const c2 = document.getElementById("c2");
      BG.forEach((g, i) => {
        const el = document.createElement("div");
        el.className = "ph";
        el.innerHTML =
          `<svg class="p" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="g${i}" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="${g[0]}"/><stop offset="1" stop-color="${g[1]}"/></radialGradient></defs>` +
          `<rect width="100" height="100" fill="url(#g${i})"/><path d="M14 104 C16 74 34 66 50 66 C66 66 84 74 86 104Z" fill="${OUT[i]}"/>` +
          `<rect x="44" y="52" width="12" height="16" rx="5" fill="#d9a88c"/><ellipse cx="50" cy="40" rx="15" ry="18" fill="#e7b99c"/>` +
          `<path d="M34 40 C33 22 44 16 52 17 C63 18 68 27 66 42 C63 32 56 27 47 29 C41 30 37 35 34 40Z" fill="#3a2a22"/></svg>` +
          `<div class="sh"></div><div class="d">Day ${i + 1}</div><div class="play"></div><div class="pr"><i></i></div>`;
        c2.appendChild(el);
      });

      // waveform bars
      const fillBars = (id, color, n) => {
        const box = document.getElementById(id);
        for (let i = 0; i < n; i++) { const b = document.createElement("b"); b.style.background = color; box.appendChild(b); }
        return Array.from(box.children);
      };
      const wv1 = fillBars("wv1", "#d8f27f", 40);
      const wv2 = fillBars("wv2", "#b9a8f0", 40);

      // calendar 30 days
      const cal = document.getElementById("cal");
      for (let d = 1; d <= 30; d++) {
        const c = document.createElement("i");
        c.className = "on";
        c.textContent = d;
        cal.appendChild(c);
      }

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const inS = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);
      const outS = (sel, t) => tl.to(sel, { opacity: 0, y: -24, duration: 0.2, ease: "power2.in" }, t);
      const pop = (sel, t, st) => tl.fromTo(sel, { opacity: 0, scale: 0.85, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(1.6)", stagger: st || 0 }, t);

      // 0 · logo + four tools (0.09 – 1.88)
      inS("#s0", 0.05);
      pop("#c0", 0.05);
      pop("#k1, #k2, #k3, #k4", 0.75, 0.12);
      outS("#s0", 2.1);

      // 1 · chat (2.38 – 4.95)
      inS("#s1", 2.3);
      const msg = "Write 30 days of Reels scripts";
      const ty = { n: 0 };
      tl.to(ty, { n: msg.length, duration: 0.65, ease: "none", onUpdate: () => { document.getElementById("typed").textContent = msg.slice(0, Math.round(ty.n)); } }, 2.55);
      tl.fromTo("#s1 .row", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", stagger: 0.2 }, 3.5);
      const n1 = { v: 0 };
      tl.to(n1, { v: 30, duration: 1.3, ease: "power1.inOut", onUpdate: () => { document.getElementById("n1").textContent = Math.round(n1.v); } }, 3.6);
      outS("#s1", 5.05);

      // 2 · photos generate (5.23 – 7.25)
      inS("#s2", 5.2);
      pop("#c2", 5.2);
      tl.fromTo("#c2 .sh", { backgroundPosition: "100% 0" }, { backgroundPosition: "-100% 0", duration: 0.7, ease: "none", stagger: 0.08 }, 5.4);
      tl.fromTo("#c2 svg.p", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out", stagger: 0.18 }, 6.0);
      tl.to("#c2 .sh", { opacity: 0, duration: 0.2, stagger: 0.18 }, 6.0);

      // 3 · same tiles become videos (7.68 – 9.57)
      tl.to("#ch2", { scale: 0.92, duration: 0.1, ease: "power2.in" }, 7.6);
      tl.set("#ch2 .a2", { display: "none" }, 7.7);
      tl.set("#ch2 .a3", { display: "inline" }, 7.7);
      tl.to("#ch2", { scale: 1, duration: 0.25, ease: "back.out(2)" }, 7.7);
      tl.fromTo("#c2 .play", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.1 }, 8.6);
      tl.to("#c2 .play", { opacity: 0, scale: 1.3, duration: 0.25, stagger: 0.1 }, 9.1);
      tl.to("#c2 .pr", { opacity: 1, duration: 0.2, stagger: 0.1 }, 9.1);
      tl.fromTo("#c2 .pr i", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "none", stagger: 0.1 }, 9.15);
      tl.fromTo("#c2 svg.p", { scale: 1 }, { scale: 1.12, duration: 1.4, ease: "none", stagger: 0.1 }, 8.6);
      outS("#s2", 9.85);

      // 4 · voice + music (9.98 – 11.72)
      inS("#s4", 9.95);
      const wave = (bars, t0, t1, amp) => {
        bars.forEach((b, i) => {
          let t = t0 + i * 0.012;
          while (t < t1) {
            const h = 0.12 + amp * rnd() * (0.55 + 0.45 * Math.sin(i * 0.35));
            tl.to(b, { scaleY: Math.max(0.08, h), duration: 0.12, ease: "sine.inOut" }, t);
            t += 0.12;
          }
          tl.to(b, { scaleY: 0.08, duration: 0.2 }, t1);
        });
      };
      wave(wv1, 10.25, 11.9, 0.95);
      wave(wv2, 10.9, 11.95, 0.75);
      outS("#s4", 12.0);

      // 5 · post (12.13 – 12.57)
      inS("#s5", 12.05);
      tl.fromTo("#cursor", { x: 160, y: 140, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 12.1);
      tl.to("#post", { scale: 0.93, duration: 0.08, ease: "power2.in" }, 12.42);
      tl.to("#post", { scale: 1, duration: 0.2, ease: "back.out(3)" }, 12.5);
      tl.to("#post .ok", { opacity: 1, duration: 0.12 }, 12.5);
      outS("#s5", 12.72);

      // 6 · a month (12.91 – 13.72) in one evening (14.09 – 14.70)
      inS("#s6", 12.9);
      tl.to("#cal i", { backgroundColor: "#d8f27f", borderColor: "#d8f27f", color: "#11151f", duration: 0.12, stagger: 0.03 }, 13.0);
      tl.fromTo("#eve", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 14.05);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
