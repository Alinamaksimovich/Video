<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>MIRRO — промо из записи экрана</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/cormorant-cyr.woff2") format("woff2");
        font-weight: 300 700;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/cormorant-lat.woff2") format("woff2");
        font-weight: 300 700;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2190-2199, U+2212, U+2215;
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/manrope-cyr.woff2") format("woff2");
        font-weight: 200 800;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/manrope-lat.woff2") format("woff2");
        font-weight: 200 800;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2190-2199, U+2212, U+2215;
      }

      :root {
        --cream: #f7f5f1;
        --ink: #1e1d1b;
        --muted: #6f6a63;
        --lime: #dcf27e;
        --lavender: #b9a8f0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--cream);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--cream);
        font-family: "Manrope", sans-serif;
        color: var(--ink);
      }

      .disc {
        position: absolute;
        left: -60px;
        top: 560px;
        width: 1200px;
        height: 1200px;
        border-radius: 50%;
      }
      #disc-lime {
        background: radial-gradient(circle, rgba(220, 242, 126, 0.95) 0%, rgba(220, 242, 126, 0.55) 45%, rgba(220, 242, 126, 0) 70%);
      }
      #disc-lav {
        background: radial-gradient(circle, rgba(185, 168, 240, 0.9) 0%, rgba(185, 168, 240, 0.5) 45%, rgba(185, 168, 240, 0) 70%);
        opacity: 0;
      }

      .caption {
        position: absolute;
        top: 150px;
        left: 50px;
        width: 980px;
        text-align: center;
        font-weight: 800;
        font-size: 92px;
        line-height: 1.22;
        letter-spacing: -0.035em;
        text-wrap: balance;
        opacity: 0;
      }
      .caption .w {
        display: inline-block;
        position: relative;
      }
      .caption .hl {
        padding: 0 14px;
      }
      .caption .hl-bg {
        position: absolute;
        left: 0;
        right: 0;
        top: 16%;
        bottom: 8%;
        border-radius: 18px;
        transform-origin: left center;
      }
      .caption .hl-bg.lime {
        background: var(--lime);
      }
      .caption .hl-bg.lav {
        background: var(--lavender);
      }
      .caption .hl-txt {
        position: relative;
      }

      #rig {
        position: absolute;
        left: 180px;
        top: 590px;
        width: 720px;
        height: 1311px;
      }
      #phone {
        position: absolute;
        inset: 0;
        padding: 14px;
        border-radius: 72px;
        background: #121212;
        box-shadow:
          0 50px 90px rgba(70, 50, 30, 0.25),
          0 12px 30px rgba(70, 50, 30, 0.15);
      }
      #screen {
        position: relative;
        width: 692px;
        height: 1283px;
        border-radius: 58px;
        overflow: hidden;
        background: #fff;
      }
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 692px;
        height: 1283px;
      }
      #rec {
        display: block;
        width: 692px;
        height: 1283px;
        object-fit: cover;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
      }
      .ripple {
        position: absolute;
        width: 130px;
        height: 130px;
        margin: -65px 0 0 -65px;
        border-radius: 50%;
        border: 6px solid var(--lavender);
        background: rgba(185, 168, 240, 0.28);
        opacity: 0;
      }

      #end {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
      }
      #shock {
        position: absolute;
        left: 290px;
        top: 710px;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        border: 14px solid var(--lime);
        opacity: 0;
      }
      #logo {
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: 250px;
        line-height: 1;
        letter-spacing: 0.06em;
        opacity: 0;
      }
      #tagline {
        font-size: 48px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: -0.01em;
        opacity: 0;
      }
      #cta {
        margin-top: 50px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 36px 66px;
        border-radius: 999px;
        background: var(--lime);
        font-size: 48px;
        font-weight: 800;
        letter-spacing: -0.02em;
        opacity: 0;
      }
      #cta-arrow {
        display: inline-block;
      }
      #bgflash {
        position: absolute;
        inset: 0;
        background: var(--lime);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-width="1080"
      data-height="1920"
    >
      <!-- sound: music + sfx from tools/soundtrack.py, voiceover supplied by the client -->
      <audio id="music" src="assets/audio/music.wav" data-start="0" data-duration="24" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="24" data-track-index="11" data-volume="0.65"></audio>
      <audio id="voice" src="assets/audio/voice.wav" data-start="0.25" data-track-index="12" data-volume="1"></audio>

      <div id="disc-lime" class="disc" data-layout-allow-overflow></div>
      <div id="disc-lav" class="disc" data-layout-allow-overflow></div>
      <div id="bgflash"></div>

      <!-- data-span = voiceover phrase window on the final timeline -->
      <div class="caption" id="cap0" data-span="0.25,2.6">Лучшее приложение для <span class="hl" data-tone="lime">гардероба</span></div>
      <div class="caption" id="cap1" data-span="3.34,6.2">Загрузи селфи — <span class="hl" data-tone="lav">твой AI-аватар</span></div>
      <div class="caption" id="cap2" data-span="7.06,8.3">Сфотографируй <span class="hl" data-tone="lime">любую вещь</span></div>
      <div class="caption" id="cap3" data-span="8.96,11.2">AI вырежет и добавит <span class="hl" data-tone="lav">в гардероб</span></div>
      <div class="caption" id="cap4" data-span="12.37,12.9">Собери <span class="hl" data-tone="lime">образ</span></div>
      <div class="caption" id="cap5" data-span="13.67,15.6">Пара секунд — и ты видишь <span class="hl" data-tone="lav">результат</span></div>
      <div class="caption" id="cap6" data-span="17.08,18.9">Понравилось? Сохрани в <span class="hl" data-tone="lime">«Образы»</span></div>

      <div id="rig">
        <div id="phone">
          <div id="screen">
            <div id="cam" data-layout-allow-overflow>
              <video id="rec" src="assets/video/screen-edit.mp4" muted playsinline data-start="0" data-duration="20" data-track-index="1"></video>
              <div class="ripple" id="rip-add" style="left: 346px; top: 1103px"></div>
              <div class="ripple" id="rip-pick" style="left: 346px; top: 1052px"></div>
              <div class="ripple" id="rip-try" style="left: 415px; top: 1180px"></div>
              <div class="ripple" id="rip-chip" style="left: 173px; top: 885px"></div>
              <div class="ripple" id="rip-save" style="left: 346px; top: 1065px"></div>
            </div>
            <div id="flash"></div>
          </div>
        </div>
      </div>

      <div id="shock"></div>
      <div id="end">
        <div id="logo">MIRRO</div>
        <div id="tagline">твой гардероб в телефоне</div>
        <div id="cta">Попробуй бесплатно <span id="cta-arrow">→</span></div>
      </div>
    </div>

    <script>
      const BEAT = 0.5;
      const SW = 692;
      const SH = 1283;
      // fromTo from-values apply only when each tween starts; resting states live in CSS
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });

      // ---------- captions: words spread across the voiceover phrase ----------
      document.querySelectorAll(".caption").forEach((el) => {
        const parts = [];
        el.childNodes.forEach((n) => {
          if (n.nodeType === 3) {
            n.textContent
              .split(" ")
              .filter(Boolean)
              .forEach((w) => parts.push('<span class="w">' + w + "</span>"));
          } else {
            parts.push(
              '<span class="w hl"><span class="hl-bg ' + (n.dataset.tone === "lav" ? "lav" : "lime") + '"></span><span class="hl-txt">' + n.textContent + "</span></span>"
            );
          }
        });
        el.innerHTML = parts.join(" ");
      });

      function caption(id, outAt) {
        const el = document.querySelector(id);
        const [a, b] = el.dataset.span.split(",").map(Number);
        const words = [...el.querySelectorAll(".w")];
        const total = words.reduce((s, w) => s + w.textContent.length, 0);
        let acc = 0;
        tl.set(id, { opacity: 1, y: 0 }, a - 0.02);
        words.forEach((w) => {
          const t = a + (acc / total) * (b - a);
          acc += w.textContent.length;
          tl.fromTo(w, { opacity: 0, y: 40, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "back.out(1.5)" }, t);
          const bg = w.querySelector(".hl-bg");
          if (bg) tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, t + 0.08);
        });
        tl.to(id, { opacity: 0, y: -50, duration: 0.18, ease: "power2.in" }, outAt);
      }
      caption("#cap0", 2.8);
      caption("#cap1", 6.8);
      caption("#cap2", 8.75);
      caption("#cap3", 11.85);
      caption("#cap4", 13.45);
      caption("#cap5", 16.75);
      caption("#cap6", 19.5);

      // ---------- camera: zoom the recording toward a point (normalised coords) ----------
      let camS = 1;
      let camX = 0;
      let camY = 0;
      function camTarget(px, py, s) {
        const x = Math.min(0, Math.max(SW * (1 - s), SW * (0.5 - s * px)));
        const y = Math.min(0, Math.max(SH * (1 - s), SH * (0.5 - s * py)));
        return { x, y, scale: s };
      }
      function zoom(at, px, py, s, dur = 0.4, ease = "power3.inOut") {
        const from = { x: camX, y: camY, scale: camS };
        const to = camTarget(px, py, s);
        tl.fromTo("#cam", from, { ...to, duration: dur, ease }, at);
        camX = to.x;
        camY = to.y;
        camS = to.scale;
      }
      function cut(at, px = 0.5, py = 0.5, s = 1) {
        const to = camTarget(px, py, s);
        tl.set("#cam", { ...to, transformOrigin: "0 0" }, at);
        camX = to.x;
        camY = to.y;
        camS = to.scale;
      }
      tl.set("#cam", { transformOrigin: "0 0", x: 0, y: 0, scale: 1 }, 0);

      function ripple(id, at) {
        tl.fromTo(id, { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.8, duration: 0.45, ease: "power2.out" }, at);
      }
      function whip(at, dir) {
        tl.to("#phone", { rotation: 4 * dir, duration: 0.15, ease: "power2.out" }, at - 0.1);
        tl.to("#phone", { rotation: 0, duration: 0.45, ease: "back.out(2)" }, at + 0.05);
        tl.fromTo("#flash", { opacity: 0.55 }, { opacity: 0, duration: 0.22, ease: "power2.out" }, at);
      }
      function discSwap(at, toLav) {
        tl.to("#disc-lime", { opacity: toLav ? 0 : 1, duration: 0.3 }, at);
        tl.to("#disc-lav", { opacity: toLav ? 1 : 0, duration: 0.3 }, at);
      }

      // ---------- beat pulse until the breath before the logo ----------
      for (let b = 1; b * BEAT < 19.5; b++) {
        const t = b * BEAT;
        tl.fromTo("#rig", { scale: 1.018 }, { scale: 1, duration: 0.38, ease: "power2.out" }, t);
        tl.fromTo(".disc", { scale: 1.05 }, { scale: 1, duration: 0.42, ease: "power2.out" }, t);
      }

      // ---------- 0–3 · hook montage ----------
      tl.fromTo("#disc-lime", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 0);
      tl.fromTo("#phone", { y: 1100, rotation: -14 }, { y: 0, rotation: 0, duration: 0.75, ease: "back.out(1.3)" }, 0);
      cut(0, 0.5, 0.45, 1.15);
      zoom(0.4, 0.5, 0.45, 1.0, 0.6, "power2.out");
      whip(1.0, 1);
      cut(1.0, 0.5, 0.55, 1.2);
      zoom(1.05, 0.5, 0.5, 1.0, 0.8, "power2.out");
      whip(2.0, -1);
      cut(2.0, 0.5, 0.4, 1.0);
      zoom(2.05, 0.5, 0.4, 1.28, 0.35, "power4.out");

      // ---------- 3–7 · avatar ----------
      whip(3.0, 1);
      cut(3.0);
      discSwap(3.0, true);
      zoom(3.2, 0.25, 0.5, 1.5, 0.45);
      zoom(4.3, 0.5, 0.5, 1.0, 0.4);
      zoom(6.15, 0.5, 0.42, 1.32, 0.35, "power4.out");

      // ---------- 7–9 · add item ----------
      whip(7.0, -1);
      cut(7.0);
      discSwap(7.0, false);
      zoom(7.12, 0.5, 0.56, 1.5, 0.4);
      zoom(8.15, 0.5, 0.5, 1.0, 0.35);

      // ---------- 9–12 · AI cut-out → wardrobe ----------
      whip(9.0, 1);
      cut(9.0);
      discSwap(9.0, true);
      zoom(9.35, 0.5, 0.33, 1.55, 0.35, "power4.out");
      zoom(10.1, 0.35, 0.28, 1.4, 0.35);
      zoom(10.55, 0.5, 0.86, 1.45, 0.3);
      ripple("#rip-add", 10.7);
      cut(11.0);
      zoom(11.05, 0.25, 0.32, 1.35, 0.9, "sine.inOut");

      // ---------- 12–15.4 · build the look, try on ----------
      whip(12.0, -1);
      cut(12.0);
      discSwap(12.0, false);
      zoom(12.08, 0.5, 0.82, 1.5, 0.35);
      ripple("#rip-pick", 12.5);
      ripple("#rip-pick", 13.1);
      zoom(13.25, 0.6, 0.92, 1.5, 0.25);
      ripple("#rip-try", 13.5);
      zoom(13.65, 0.5, 0.42, 1.1, 0.4);

      // ---------- 15.4–17 · result ----------
      tl.fromTo("#flash", { opacity: 0.9 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 15.4);
      tl.fromTo("#rig", { scale: 1.05 }, { scale: 1, duration: 0.4, ease: "power2.out" }, 15.4);
      cut(15.4, 0.5, 0.4, 1.0);
      zoom(15.42, 0.5, 0.4, 1.3, 0.3, "power4.out");
      zoom(15.75, 0.5, 0.4, 1.38, 1.2, "sine.inOut");
      discSwap(15.4, true);

      // ---------- 17–20 · save to "Образы" ----------
      whip(17.0, 1);
      cut(17.0);
      discSwap(17.0, false);
      zoom(17.2, 0.3, 0.72, 1.45, 0.4);
      ripple("#rip-chip", 17.9);
      zoom(18.3, 0.5, 0.83, 1.45, 0.3);
      ripple("#rip-save", 18.6);
      zoom(19.0, 0.5, 0.5, 1.0, 0.35);

      // phone flies away before the logo
      tl.to("#phone", { y: -260, scale: 1.18, rotation: 7, opacity: 0, duration: 0.5, ease: "power3.in" }, 19.45);
      tl.to(".disc", { scale: 0.3, opacity: 0, duration: 0.5, ease: "power3.in" }, 19.45);

      // ---------- 20–24 · MIRRO ----------
      tl.fromTo("#bgflash", { opacity: 0.9 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, 20.0);
      tl.fromTo("#logo", { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 20.0);
      tl.fromTo("#shock", { opacity: 1, scale: 0.2 }, { opacity: 0, scale: 3.2, duration: 0.8, ease: "power2.out" }, 20.0);
      tl.fromTo("#tagline", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 20.55);
      tl.fromTo("#cta", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 21.3);
      for (let t = 22.0; t <= 23.0; t += BEAT) {
        tl.fromTo("#cta", { scale: 1.05 }, { scale: 1, duration: 0.35, ease: "power2.out" }, t);
        tl.fromTo("#logo", { scale: 1.015 }, { scale: 1, duration: 0.4, ease: "power2.out" }, t);
      }
      tl.fromTo("#cta-arrow", { x: 0 }, { x: 12, duration: 0.25, ease: "sine.inOut", repeat: 5, yoyo: true }, 22.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
