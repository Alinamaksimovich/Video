<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>MIRRO — динамичное промо</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/cormorant-cyr.woff2") format("woff2");
        font-weight: 300 700;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/cormorant-lat.woff2") format("woff2");
        font-weight: 300 700;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2190-2199, U+2212, U+2215;
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/manrope-cyr.woff2") format("woff2");
        font-weight: 200 800;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/manrope-lat.woff2") format("woff2");
        font-weight: 200 800;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2190-2199, U+2212, U+2215;
      }

      :root {
        --cream: #f7f5f1;
        --ink: #1e1d1b;
        --muted: #6f6a63;
        --lime: #dcf27e;
        --lavender: #b9a8f0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--cream);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--cream);
        font-family: "Manrope", sans-serif;
        color: var(--ink);
      }

      /* background discs that pulse with the beat */
      .disc {
        position: absolute;
        left: -60px;
        top: 560px;
        width: 1200px;
        height: 1200px;
        border-radius: 50%;
      }
      #disc-lime {
        background: radial-gradient(circle, rgba(220, 242, 126, 0.95) 0%, rgba(220, 242, 126, 0.55) 45%, rgba(220, 242, 126, 0) 70%);
      }
      #disc-lav {
        background: radial-gradient(circle, rgba(185, 168, 240, 0.9) 0%, rgba(185, 168, 240, 0.5) 45%, rgba(185, 168, 240, 0) 70%);
        opacity: 0;
      }

      /* kinetic captions */
      .caption {
        position: absolute;
        top: 150px;
        left: 50px;
        width: 980px;
        text-align: center;
        font-weight: 800;
        font-size: 94px;
        line-height: 1.18;
        letter-spacing: -0.035em;
        text-wrap: balance;
        opacity: 0;
      }
      .caption .w {
        display: inline-block;
        position: relative;
      }
      .caption .hl {
        display: inline-block;
        position: relative;
        padding: 0 14px;
      }
      .caption .hl-bg {
        position: absolute;
        left: 0;
        right: 0;
        top: 16%;
        bottom: 8%;
        border-radius: 18px;
        transform-origin: left center;
      }
      .caption .hl-bg.lime {
        background: var(--lime);
      }
      .caption .hl-bg.lav {
        background: var(--lavender);
      }
      .caption .hl-txt {
        position: relative;
      }

      /* phone rig: #rig takes the beat pulse, #phone takes the moves */
      #rig {
        position: absolute;
        left: 180px;
        top: 590px;
        width: 720px;
        height: 1311px;
      }
      #phone {
        position: absolute;
        inset: 0;
        padding: 14px;
        border-radius: 72px;
        background: #121212;
        box-shadow:
          0 50px 90px rgba(70, 50, 30, 0.25),
          0 12px 30px rgba(70, 50, 30, 0.15);
      }
      #screen {
        position: relative;
        width: 692px;
        height: 1283px;
        border-radius: 58px;
        overflow: hidden;
        background: var(--cream);
      }
      .layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .layer img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #layer2,
      #layer3,
      #layer4 {
        opacity: 0;
      }
      #l2zoom {
        position: absolute;
        inset: 0;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
      }

      /* AI scan on the processing card (screen px) */
      #scan {
        position: absolute;
        left: 167px;
        top: 274px;
        width: 359px;
        height: 360px;
        border-radius: 34px;
        overflow: hidden;
        opacity: 0;
      }
      #scan-wash {
        position: absolute;
        inset: 0;
        background: rgba(185, 168, 240, 0.16);
      }
      #scan-line {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 5px;
        background: var(--lavender);
        box-shadow:
          0 0 20px 8px rgba(185, 168, 240, 0.8),
          0 0 46px 16px rgba(185, 168, 240, 0.4);
      }
      #scan-ring {
        position: absolute;
        left: 158px;
        top: 259px;
        width: 377px;
        height: 390px;
        border-radius: 40px;
        border: 4px solid var(--lavender);
        opacity: 0;
      }
      .spark {
        position: absolute;
        width: 46px;
        height: 46px;
        clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%);
        opacity: 0;
      }
      .spark.lime {
        background: #c6e04f;
      }
      .spark.lav {
        background: #9d86ef;
      }

      /* tap ripple */
      .ripple {
        position: absolute;
        width: 120px;
        height: 120px;
        margin: -60px 0 0 -60px;
        border-radius: 50%;
        border: 6px solid var(--lavender);
        background: rgba(185, 168, 240, 0.25);
        opacity: 0;
      }

      /* end card */
      #end {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
      }
      #shock {
        position: absolute;
        left: 290px;
        top: 710px;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        border: 14px solid var(--lime);
        opacity: 0;
      }
      #logo {
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: 250px;
        line-height: 1;
        letter-spacing: 0.06em;
        opacity: 0;
      }
      #tagline {
        font-size: 46px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: -0.01em;
        opacity: 0;
      }
      #cta {
        margin-top: 50px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 36px 66px;
        border-radius: 999px;
        background: var(--lime);
        font-size: 46px;
        font-weight: 800;
        letter-spacing: -0.02em;
        opacity: 0;
      }
      #cta-arrow {
        display: inline-block;
      }
      #bgflash {
        position: absolute;
        inset: 0;
        background: var(--lime);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <!-- sound: stems generated by tools/soundtrack.py -->
      <audio id="music" src="assets/audio/music.wav" data-start="0" data-duration="15" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="15" data-track-index="11" data-volume="0.6"></audio>
      <audio id="voice" src="assets/audio/voice.wav" data-start="0.6" data-track-index="12" data-volume="1"></audio>

      <div id="disc-lime" class="disc"></div>
      <div id="disc-lav" class="disc"></div>
      <div id="bgflash"></div>

      <div class="caption" id="cap1" data-at="0.6,0.9,1.82,1.95">Весь гардероб <span class="hl" data-tone="lime">— в телефоне</span></div>
      <div class="caption" id="cap2" data-at="2.98,3.75">Сфотографируй вещь</div>
      <div class="caption" id="cap3" data-at="4.59,4.9,5.3,5.5">AI вырежет её <span class="hl" data-tone="lav">за секунды</span></div>
      <div class="caption" id="cap4" data-at="6.8,7.3,7.75">Примеряй образы <span class="hl" data-tone="lime">на себе</span></div>
      <div class="caption" id="cap5" data-at="8.7,9.05,9.25">Меняй их в <span class="hl" data-tone="lav">одно касание</span></div>

      <div id="rig">
        <div id="phone">
          <div id="screen">
            <div class="layer" id="layer1" data-layout-allow-overflow>
              <img id="img1" src="assets/screens/wardrobe.png" alt="" />
            </div>
            <div class="layer" id="layer2" data-layout-allow-overflow>
              <div id="l2zoom" data-layout-allow-overflow>
                <img id="img2" src="assets/screens/processing.png" alt="" />
                <div id="scan-ring"></div>
                <div id="scan" data-layout-allow-overflow>
                  <div id="scan-wash"></div>
                  <div id="scan-line"></div>
                </div>
                <div class="spark lime" id="sp1" style="left: 120px; top: 250px"></div>
                <div class="spark lav" id="sp2" style="left: 530px; top: 300px"></div>
                <div class="spark lime" id="sp3" style="left: 545px; top: 560px"></div>
                <div class="spark lav" id="sp4" style="left: 110px; top: 590px"></div>
                <div class="spark lime" id="sp5" style="left: 330px; top: 220px"></div>
                <div class="spark lav" id="sp6" style="left: 320px; top: 660px"></div>
              </div>
            </div>
            <div class="layer" id="layer3" data-layout-allow-overflow>
              <img id="img3" src="assets/screens/tryon-1.png" alt="" />
            </div>
            <div class="layer" id="layer4" data-layout-allow-overflow>
              <img id="img4" src="assets/screens/tryon-2.png" alt="" />
            </div>
            <div class="ripple" id="rip1" style="left: 160px; top: 1055px"></div>
            <div class="ripple" id="rip2" style="left: 425px; top: 1055px"></div>
            <div class="ripple" id="rip3" style="left: 160px; top: 1055px"></div>
            <div id="flash"></div>
          </div>
        </div>
      </div>

      <div id="shock"></div>
      <div id="end">
        <div id="logo">MIRRO</div>
        <div id="tagline">твой онлайн-гардероб</div>
        <div id="cta">Попробуй уже сейчас <span id="cta-arrow">→</span></div>
      </div>
    </div>

    <script>
      const BEAT = 0.5;
      // fromTo from-values apply only when each tween starts; resting states live in CSS
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });

      // ---------- captions: word spans timed to the voiceover ----------
      document.querySelectorAll(".caption").forEach((el) => {
        const parts = [];
        el.childNodes.forEach((n) => {
          if (n.nodeType === 3) {
            n.textContent
              .split(" ")
              .filter(Boolean)
              .forEach((w) => parts.push('<span class="w">' + w + "</span>"));
          } else {
            parts.push(
              '<span class="w hl"><span class="hl-bg ' +
                (n.dataset.tone === "lav" ? "lav" : "lime") +
                '"></span><span class="hl-txt">' +
                n.textContent +
                "</span></span>"
            );
          }
        });
        el.innerHTML = parts.join(" ");
      });

      function caption(id, outAt) {
        const el = document.querySelector(id);
        const at = el.dataset.at.split(",").map(Number);
        tl.set(id, { opacity: 1 }, at[0] - 0.02);
        el.querySelectorAll(".w").forEach((w, i) => {
          const t = at[Math.min(i, at.length - 1)];
          tl.fromTo(w, { opacity: 0, y: 70, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(2.2)" }, t);
          const bg = w.querySelector(".hl-bg");
          if (bg) tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, t + 0.08);
        });
        tl.to(id, { opacity: 0, y: -50, duration: 0.18, ease: "power2.in" }, outAt);
      }
      caption("#cap1", 2.78);
      caption("#cap2", 4.4);
      caption("#cap3", 6.25);
      caption("#cap4", 8.42);
      caption("#cap5", 10.4);

      // ---------- beat pulse (kicks every 0.5 s, breath before the drop) ----------
      for (let b = 1; b * BEAT < 10.5; b++) {
        const t = b * BEAT;
        tl.fromTo("#rig", { scale: 1.022 }, { scale: 1, duration: 0.38, ease: "power2.out" }, t);
        tl.fromTo(".disc", { scale: 1.06 }, { scale: 1, duration: 0.42, ease: "power2.out" }, t);
      }

      // ---------- 0–3 · Гардероб ----------
      tl.fromTo("#disc-lime", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 0);
      tl.fromTo("#phone", { y: 1100, rotation: -14 }, { y: 0, rotation: 0, duration: 0.75, ease: "back.out(1.3)" }, 0);
      tl.fromTo("#img1", { scale: 1 }, { scale: 1.13, duration: 0.35, ease: "power4.out", transformOrigin: "50% 60%" }, 1.82);
      tl.to("#img1", { scale: 1.18, duration: 0.6, ease: "sine.inOut", transformOrigin: "50% 60%" }, 2.17);

      // whip → Обработка
      tl.fromTo("#layer2", { opacity: 1, xPercent: 100 }, { xPercent: 0, duration: 0.3, ease: "expo.inOut" }, 2.76);
      tl.to("#layer1", { xPercent: -45, duration: 0.3, ease: "expo.inOut" }, 2.76);
      tl.to("#phone", { rotation: -5, duration: 0.15, ease: "power2.out" }, 2.76);
      tl.to("#phone", { rotation: 0, duration: 0.45, ease: "back.out(2)" }, 2.91);
      tl.to("#disc-lime", { opacity: 0, duration: 0.3 }, 2.8);
      tl.to("#disc-lav", { opacity: 1, duration: 0.3 }, 2.8);

      // ---------- 3–6.5 · AI processing ----------
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.95, duration: 0.04 }, 3.25);
      tl.to("#flash", { opacity: 0, duration: 0.32, ease: "power2.out" }, 3.29);
      tl.fromTo("#l2zoom", { scale: 1 }, { scale: 1.05, duration: 1.25, ease: "sine.out", transformOrigin: "50% 35%" }, 3.3);
      tl.to("#l2zoom", { scale: 1.32, duration: 0.35, ease: "power4.out", transformOrigin: "50% 35%" }, 4.55);
      tl.fromTo("#scan", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 4.6);
      tl.fromTo("#scan-line", { y: 0 }, { y: 355, duration: 0.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 4.62);
      tl.fromTo("#scan-ring", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 4.65);
      ["#sp1", "#sp2", "#sp3", "#sp4", "#sp5", "#sp6"].forEach((s, i) => {
        const t = 4.75 + i * 0.125;
        tl.fromTo(s, { opacity: 0, scale: 0, rotation: -45 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.25, ease: "back.out(3)" }, t);
        tl.to(s, { opacity: 0, scale: 0.4, rotation: 45, duration: 0.3, ease: "power2.in" }, t + 0.55);
      });
      tl.to("#scan-ring", { scale: 1.04, duration: 0.25, ease: "power2.out", repeat: 3, yoyo: true }, 5.5);
      tl.to(["#scan", "#scan-ring"], { opacity: 0, duration: 0.2 }, 6.15);

      // zoom-through → Примерка 1
      tl.to("#l2zoom", { scale: 1.9, duration: 0.3, ease: "power3.in", transformOrigin: "50% 35%" }, 6.2);
      tl.fromTo("#layer3", { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.38, ease: "power3.out" }, 6.38);
      tl.to("#phone", { rotation: 4, duration: 0.15, ease: "power2.out" }, 6.35);
      tl.to("#phone", { rotation: 0, duration: 0.45, ease: "back.out(2)" }, 6.5);
      tl.to("#disc-lav", { opacity: 0, duration: 0.3 }, 6.4);
      tl.to("#disc-lime", { opacity: 1, duration: 0.3 }, 6.4);

      // ---------- 6.5–8.5 · Try-on look 1 ----------
      tl.fromTo("#img3", { scale: 1 }, { scale: 1.16, duration: 0.3, ease: "power4.out", transformOrigin: "50% 36%" }, 7.42);
      tl.to("#img3", { scale: 1.2, duration: 0.75, ease: "sine.inOut", transformOrigin: "50% 36%" }, 7.72);
      tl.to("#img3", { scale: 1, duration: 0.35, ease: "power3.inOut", transformOrigin: "50% 36%" }, 8.47);

      // ---------- 8.5–10.5 · switch looks "в одно касание" ----------
      function ripple(id, at) {
        tl.fromTo(id, { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.8, duration: 0.45, ease: "power2.out" }, at);
      }
      function swap(show, at) {
        tl.set("#layer4", { opacity: show ? 1 : 0 }, at);
        tl.fromTo("#flash", { opacity: 0.7 }, { opacity: 0, duration: 0.2, ease: "power2.out" }, at);
        tl.fromTo("#phone", { scale: 1.035 }, { scale: 1, duration: 0.3, ease: "power2.out" }, at);
      }
      ripple("#rip1", 8.88);
      swap(true, 9.0);
      ripple("#rip2", 9.4);
      swap(false, 9.5);
      ripple("#rip3", 9.9);
      swap(true, 10.0);
      tl.fromTo("#img4", { scale: 1 }, { scale: 1.07, duration: 1.4, ease: "sine.inOut", transformOrigin: "50% 36%" }, 9.0);

      // riser: phone flies up and away
      tl.to("#phone", { y: -260, scale: 1.18, rotation: 7, opacity: 0, duration: 0.5, ease: "power3.in" }, 10.45);
      tl.to(".disc", { scale: 0.3, opacity: 0, duration: 0.5, ease: "power3.in" }, 10.45);

      // ---------- 11–15 · MIRRO ----------
      tl.fromTo("#bgflash", { opacity: 0.9 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, 11.0);
      tl.fromTo("#logo", { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 11.0);
      tl.fromTo("#shock", { opacity: 1, scale: 0.2 }, { opacity: 0, scale: 3.2, duration: 0.8, ease: "power2.out" }, 11.0);
      tl.fromTo("#tagline", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 11.35);
      tl.fromTo("#cta", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 11.85);
      for (let t = 12.5; t <= 14.0; t += BEAT) {
        tl.fromTo("#cta", { scale: 1.05 }, { scale: 1, duration: 0.35, ease: "power2.out" }, t);
        tl.fromTo("#logo", { scale: 1.015 }, { scale: 1, duration: 0.4, ease: "power2.out" }, t);
      }
      tl.fromTo("#cta-arrow", { x: 0 }, { x: 12, duration: 0.25, ease: "sine.inOut", repeat: 5, yoyo: true }, 12.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
