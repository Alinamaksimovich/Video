<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What do you want to create?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3ec9e6}a:hover{color:#8be0f2}
button{font-family:inherit}
@keyframes bgIn{from{opacity:0}to{opacity:1}}
@keyframes drift{0%{transform:translate3d(-20px,0,0)}50%{transform:translate3d(30px,24px,0)}100%{transform:translate3d(-20px,0,0)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.bgin{animation:bgIn .7s ease-out both}
.blob{animation:drift 9s ease-in-out infinite;will-change:transform}
.opt{animation:rise .5s ease-out both}
@media (prefers-reduced-motion: reduce){.blob,.opt{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #07080c; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, system-ui, sans-serif; color: #f4f6fb">
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(120% 58% at 50% 30%, #4a0f4c 0%, #07080c 66%)"></div>
  <div class="bgin" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(120% 55% at 50% 22%, #08414f 0%, #07080c 64%)"></div>
  <div class="blob" style="position: absolute; left: 60px; top: 90px; width: 300px; height: 200px; border-radius: 50%; background: radial-gradient(closest-side, rgba(62,201,230,0.32), rgba(62,201,230,0)); filter: blur(10px)"></div>

  <div style="position: absolute; left: 24px; right: 24px; top: 16px; display: flex; gap: 6px">
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #3ec9e6"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #3ec9e6"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #3ec9e6"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #2a3042"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #2a3042"></span>
  </div>

  <div style="position: absolute; left: 12px; right: 24px; top: 32px; height: 48px; display: flex; justify-content: space-between; align-items: center">
    <a href="Before.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a9b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <a href="Paywall.dc.html" style="color: #a3a9b8; font-size: 15px; font-weight: 600; text-decoration: none; padding: 14px 4px">Skip</a>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 104px">
    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #3ec9e6">Quick question</div>
    <h1 style="margin: 10px 0 0; font-size: 31px; line-height: 1.1; font-weight: 800; letter-spacing: -0.025em">What do you want<br>to create?</h1>
    <p style="margin: 10px 0 0; font-size: 14.5px; line-height: 1.45; color: #a3b3b8">Pick one. We will tune your first trends to it.</p>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 262px; display: flex; flex-direction: column; gap: 12px">
    <button class="opt" onClick="{{pick0}}" aria-pressed="{{on0}}" style="{{st0}}; animation-delay: 0.05s">
      <span style="{{ib0}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg></span>
      <span style="flex-grow: 1; text-align: left"><span style="display: block; font-size: 17px; font-weight: 700">Photos for socials</span><span style="display: block; margin-top: 2px; font-size: 13px; color: #9aa7ad; font-weight: 500">Posts, profiles, ads</span></span>
      <span style="{{ck0}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#07080c" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
    </button>
    <button class="opt" onClick="{{pick1}}" aria-pressed="{{on1}}" style="{{st1}}; animation-delay: 0.12s">
      <span style="{{ib1}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M10 9l5 3-5 3z"></path></svg></span>
      <span style="flex-grow: 1; text-align: left"><span style="display: block; font-size: 17px; font-weight: 700">Reels &amp; videos</span><span style="display: block; margin-top: 2px; font-size: 13px; color: #9aa7ad; font-weight: 500">Trends in motion</span></span>
      <span style="{{ck1}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#07080c" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
    </button>
    <button class="opt" onClick="{{pick2}}" aria-pressed="{{on2}}" style="{{st2}}; animation-delay: 0.19s">
      <span style="{{ib2}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l1.5 13h-15z"></path><path d="M9 10V6a3 3 0 0 1 6 0v4"></path></svg></span>
      <span style="flex-grow: 1; text-align: left"><span style="display: block; font-size: 17px; font-weight: 700">Product shots</span><span style="display: block; margin-top: 2px; font-size: 13px; color: #9aa7ad; font-weight: 500">Brand and shop visuals</span></span>
      <span style="{{ck2}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#07080c" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
    </button>
    <button class="opt" onClick="{{pick3}}" aria-pressed="{{on3}}" style="{{st3}}; animation-delay: 0.26s">
      <span style="{{ib3}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"></path></svg></span>
      <span style="flex-grow: 1; text-align: left"><span style="display: block; font-size: 17px; font-weight: 700">Just exploring</span><span style="display: block; margin-top: 2px; font-size: 13px; color: #9aa7ad; font-weight: 500">Show me what is possible</span></span>
      <span style="{{ck3}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#07080c" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
    </button>
  </div>

  <sc-if value="{{hasSel}}" hint-placeholder-val="{{ true }}">
    <a href="Quiz2.dc.html" style="position: absolute; left: 24px; right: 24px; bottom: 28px; height: 56px; border-radius: 28px; background: #3ec9e6; color: #06232b; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 34px rgba(62,201,230,0.38)">Continue</a>
  </sc-if>
  <sc-if value="{{noSel}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 24px; right: 24px; bottom: 28px; height: 56px; border-radius: 28px; background: #172029; color: #7d8a92; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Continue</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: -1 };
  }
  renderVals() {
    const sel = this.state.sel;
    const base = 'width: 100%; box-sizing: border-box; height: 80px; border-radius: 22px; display: flex; align-items: center; gap: 14px; padding: 0 18px; cursor: pointer; color: #f4f6fb; text-align: left;';
    const out = { hasSel: sel >= 0, noSel: sel < 0 };
    for (let i = 0; i < 4; i++) {
      const on = sel === i;
      out['pick' + i] = () => this.setState({ sel: i });
      out['on' + i] = on;
      out['st' + i] = base + (on ? ' border: 2px solid #3ec9e6; background: rgba(62,201,230,0.14);' : ' border: 2px solid #1f2a36; background: #0e1721;');
      out['ib' + i] = 'width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; ' + (on ? 'background: #3ec9e6; color: #06232b;' : 'background: #16222e; color: #3ec9e6;');
      out['ck' + i] = 'width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; ' + (on ? 'background: #3ec9e6;' : 'border: 2px solid #2a3846;');
    }
    return out;
  }
}
</script>
</body>
</html>
